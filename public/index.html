<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>XoloGuía - Viajes y Seguridad</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>XoloGuía 🚗</h1>
    
    <div class="buscador">
        <input type="text" id="input-destino" placeholder="Escribe tu destino (ej. Cancún)...">
        <select id="select-estado" class="select-style">
            <option value="">Selecciona Estado (Opcional)</option>
            <option value="CDMX">Ciudad de México</option>
            <option value="QR">Quintana Roo</option>
            <option value="JAL">Jalisco</option>
            <option value="NL">Nuevo León</option>
        </select>
        <button onclick="planificarViaje()">Planificar</button>
    </div>

    <div class="contenedor">
        <div id="desastres-info" class="card card-alert">
            <h3>⚠️ Alertas de Seguridad</h3>
            <div id="lista-alertas">
                <p>Busca un destino para ver alertas vigentes.</p>
            </div>
        </div>

        <div id="clima-info" class="card"><h3>Clima</h3></div>
        <div id="noticias-info" class="card"><h3>Noticias</h3></div>
        <div id="videos-info" class="card"><h3>Videos</h3></div>
        
        <div class="card">
            <h3>Mapa</h3>
            <div id="mapa" style="width: 100%; height: 400px; background-color: #e0e0e0;"></div>
        </div>

        <div class="card">
            <h3>Historial de Viajes</h3>
            <ul id="historial"></ul>
        </div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyDEOeCgTnxSAxnkXUPv99GPaTVSHvfkg"></script>
    <script src="js/clima.js"></script>
    <script src="js/noticias.js"></script>
    <script src="js/youtube.js"></script>
    <script src="js/geolocalizacion.js"></script>
    <script src="js/mapas.js"></script>
    <script src="js/desastres.js"></script> <script src="js/index.js"></script>
</body>
</html>
