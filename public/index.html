<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XoloGuía - Tu asistente de viajes en tiempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-principal">
        <h1>XoloGuía</h1>
        <p class="subtitulo">Tu asistente de viajes en tiempo real</p>
    </header>
    
    <div class="buscador-wrapper">
        <div class="buscador">
            <input type="text" id="input-destino" placeholder="Ingresa tu destino (ej. Mérida)...">
            <button onclick="planificarViaje()">Explorar</button>
        </div>
    </div>

    <main class="contenedor">
        <section id="desastres-info" class="card card-alert">
            <h3>Alertas de Seguridad</h3>
            <div id="lista-alertas">
                <p class="texto-vacio">Busca un destino para verificar condiciones de seguridad.</p>
            </div>
        </section>

        <section id="clima-info" class="card">
            <h3>Condiciones Climáticas</h3>
            <div id="contenido-clima" class="contenido-tarjeta"></div>
        </section>

        <section id="noticias-info" class="card">
            <h3>Noticias Locales</h3>
            <div id="contenido-noticias" class="contenido-tarjeta"></div>
        </section>

        <section id="videos-info" class="card">
            <h3>Guías y Recomendaciones</h3>
            <div id="contenido-videos" class="contenido-tarjeta"></div>
        </section>
        
        <section class="card card-mapa">
            <h3>Ubicación</h3>
            <div id="mapa"></div>
        </section>

        <section class="card card-historial">
            <h3>Historial de Itinerarios</h3>
            <ul id="historial"></ul>
        </section>
    </main>

    <script src="js/clima.js"></script>
    <script src="js/noticias.js"></script>
    <script src="js/youtube.js"></script>
    <script src="js/geolocalizacion.js"></script>
    <script src="js/mapas.js"></script>
    <script src="js/desastres.js"></script> 
    <script src="js/index.js"></script>
</body>
</html>
